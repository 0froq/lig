name: Core tokens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      # Source and core verification need no Nuxt preparation or application build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vp run lint
      - run: pnpm exec vp run fmt:check
      - run: pnpm exec vp run tokens:typecheck
      - run: pnpm exec vp run tokens:test
      - run: pnpm exec vp run tokens:check
