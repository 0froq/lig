name: Port contracts

on:
  push:
    paths: ['core/**', 'ports/**', 'palette/**', shared/crc32.ts, shared/documentation-themes.ts, package.json, pnpm-lock.yaml, .github/workflows/ports.yml]
  pull_request:
    paths: ['core/**', 'ports/**', 'palette/**', shared/crc32.ts, shared/documentation-themes.ts, package.json, pnpm-lock.yaml, .github/workflows/ports.yml]

permissions:
  contents: read

jobs:
  ports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ports:typecheck
      - run: python3 -B -m unittest discover -s ports/distribution/tests -v
      - run: pnpm tokens:test
      - run: pnpm tokens:check
      - run: pnpm ports:generate
      - run: pnpm ports:test
      - run: pnpm ports:check
      - run: python3 dist/ports/vscode/scripts/verify.py
      - run: python3 dist/ports/zed-extension/scripts/verify.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lig-lightweight-ports
          path: dist/ports/lightweight/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lig-zed-port
          path: dist/ports/zed-extension/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lig-neovim-port
          path: dist/ports/neovim/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lig-vscode-port
          path: dist/ports/vscode/
          if-no-files-found: error
