name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-production
  # Finish readiness/activation before starting another production deployment.
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after configuring credentials and disabling the old production trigger.
    if: github.ref == 'refs/heads/main' && vars.VOID_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run lint
      - run: pnpm exec vp run fmt:check
      - run: pnpm exec vp run typecheck
      - run: pnpm exec vp run tokens:typecheck
      - run: pnpm exec vp run tokens:test
      - run: pnpm exec vp run tokens:check
      # Native syntax tests also require the pinned Neovim/parser install.
      # Static generation consumes the checked-in syntax artifact.
      - run: pnpm exec vp run syntax:typecheck
      - run: pnpm exec vp run ports:generate
      - run: pnpm exec vp run ports:typecheck
      - run: pnpm exec vp run ports:test
      - run: pnpm exec vp run ports:check
      - run: python3 -B -m unittest discover -s ports/distribution/tests -v
      - run: python3 dist/ports/vscode/scripts/verify.py
      - run: python3 dist/ports/zed-extension/scripts/verify.py
      - name: Deploy with Void
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: sayhola
        run: pnpm exec vp run deploy
