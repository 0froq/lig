minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - .

overrides:
  # cssnano 9 dropped the staged-publish evidence required by trustPolicy.
  # Keep Nuxt 4.6.1 while retaining the previously trusted CSS minifier.
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10

allowBuilds:
  '@takumi-rs/core': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

catalog: {jiti: 2.7.0}

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint': ^1.17.0
    '@types/node': 26.6.2
    cf: 1.0.0-beta.12
    eslint: ^9.39.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^16.1.6
    nuxtseo-devtools-host: ^1
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    vue-tsc: ^3.3.11
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@froq/og-covers-layer': github:0froq/og-layer#v0.2.1
    '@nuxt/content': ^3.16.1
    '@nuxtjs/i18n': ^10.6.0
    '@shikijs/langs': 4.5.0
    nuxt: ^4.6.1
    shiki: 4.5.0
    vue: ^3.5.43
    zod: ^4.6.6
