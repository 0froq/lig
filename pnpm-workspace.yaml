minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - .

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

catalog: {jiti: 2.7.0}

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint': ^1.17.0
    '@types/node': 26.6.2
    cf: 1.0.0-beta.12
    eslint: ^9.39.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^16.1.6
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    vue-tsc: ^3.3.11
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@nuxt/content': ^3.16.1
    '@nuxtjs/i18n': ^10.6.0
    nuxt: ^4.5.2
    vue: ^3.5.43
