name: Publish extension stores
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag (for example v0.2.0)
        required: true
        type: string
      mode:
        description: Package check, Marketplace access/publication, or Open VSX publication
        required: true
        default: check-package
        type: choice
        options: [check-package, identify, verify-access, publish, bootstrap-openvsx, publish-openvsx]
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      filename: ${{ steps.prepare.outputs.filename }}
      tag: ${{ steps.prepare.outputs.tag }}
      mode: ${{ steps.mode.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          path: release
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - id: mode
        env:
          MODE: ${{ inputs.mode || 'publish' }}
        run: echo "value=$MODE" >> "$GITHUB_OUTPUT"
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          args=()
          case "$MODE" in
            publish|bootstrap-openvsx|publish-openvsx) ;;
            *) args+=(--dry-run) ;;
          esac
          python3 scripts/release.py prepare --root release --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/vsix" "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lig-marketplace-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error
  marketplace:
    needs: prepare
    if: contains(fromJSON('["identify", "verify-access", "publish"]'), needs.prepare.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          name: lig-marketplace-vsix
          path: vsix
      - name: Check OIDC configuration
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo '::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See PUBLISHING.md.'
            exit 1
          fi
      - name: Sign in with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Identify Marketplace member
        if: needs.prepare.outputs.mode == 'identify'
        run: |
          profile_id=$(az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)
          test -n "$profile_id"
          echo "Marketplace member ID: $profile_id" >> "$GITHUB_STEP_SUMMARY"
          echo 'Add this ID to the froQ publisher with Contributor access, then run verify-access.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify publisher permission without publishing
        if: needs.prepare.outputs.mode == 'verify-access'
        run: npx --yes @vscode/vsce@3.6.2 verify-pat froQ --azure-credential
      - name: Publish the verified release package
        if: needs.prepare.outputs.mode == 'publish'
        env:
          VSIX_FILENAME: ${{ needs.prepare.outputs.filename }}
        run: npx --yes @vscode/vsce@3.6.2 publish --packagePath "vsix/$VSIX_FILENAME" --azure-credential --skip-duplicate
  openvsx:
    needs: prepare
    if: needs.prepare.outputs.mode == 'bootstrap-openvsx' || needs.prepare.outputs.mode == 'publish-openvsx' || (needs.prepare.outputs.mode == 'publish' && vars.OPEN_VSX_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          name: lig-marketplace-vsix
          path: vsix
      - name: First Open VSX publication
        if: needs.prepare.outputs.mode == 'bootstrap-openvsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_FILENAME: ${{ needs.prepare.outputs.filename }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Complete the Open VSX publisher agreement and set OVSX_PAT in the open-vsx environment. See PUBLISHING.md.'
            exit 1
          fi
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/openvsx-namespace.json" --write-out '%{http_code}' https://open-vsx.org/api/froQ)
          case "$status" in
            404) npx --yes ovsx@1.2.0 create-namespace froQ ;;
            200) ;;
            *) echo "::error::Open VSX namespace lookup failed (HTTP $status)."; exit 1 ;;
          esac
          npx --yes ovsx@1.2.0 publish "vsix/$VSIX_FILENAME" --skip-duplicate
      - name: Publish to Open VSX with OIDC
        if: needs.prepare.outputs.mode != 'bootstrap-openvsx'
        env:
          VSIX_FILENAME: ${{ needs.prepare.outputs.filename }}
        run: npx --yes ovsx@1.2.0 publish "vsix/$VSIX_FILENAME" --trusted-publishing --skip-duplicate
