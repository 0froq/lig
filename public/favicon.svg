<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .frame { stroke: #16161a; }
    .dot { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #f2f2ee; }
      .dot { fill: #2dd4bf; }
    }
  </style>
  <rect class="frame" x="1" y="1" width="30" height="30" fill="none" stroke-width="2"/>
  <circle class="dot" cx="16" cy="16" r="3.5"/>
</svg>
